<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Quality based Self Check of Products & Services</title>
  </head>
  <body>
    <main class="container wide">
      <div style="text-align:center; margin:12px 0 0;">
        <img class="hero-logo" src="assets/QuXAT%20Logo%20Facebook.png" alt="QuXAT logo" />
      </div>
      <section class="card hero-card">
        <h2>Quality based Self Check of Products & Services</h2>
        <p class="hint">Customers/Clients can use these self‑check checklists to assess the quality of products / services provided by organizations under each category.</p>
      </section>

      <section class="card info">
        <h3>Available Checklists</h3>
        <div id="cardsMount" class="cards-grid"></div>
        <div id="cardsEmpty" class="empty" hidden>No service checklists published yet.</div>
      </section>

      <section class="card">
        <h3>Existing Service Checklists</h3>
        <div id="existingLists" class="table-container"></div>
      </section>
    </main>

    <script>
      (function(){
        function normalizeCategoryLabel(label){
          const s = String(label || '').trim();
          const map = {
            'foods & consumables': 'Foods & Consumables',
            'industrial & manufacturing': 'Industrial & Manufacturing',
            'public & community organizations': 'Public & Community Organizations',
            'hospitals & healthcare': 'Hospitals & Healthcare',
            'schools': 'Schools',
            'colleges & universities': 'Colleges & Universities',
            'offices & corporate': 'Offices & Corporate',
            'travel & transportation': 'Travel & Transportation',
          };
          const key = s.toLowerCase();
          return map[key] || s || '';
        }
        function deriveCategory(raw){ return normalizeCategoryLabel(raw); }
        function displayCategory(cat){
          const m = {
            'Industry & Offices': 'Food & Beverages',
            'Offices & Corporate': 'Consumer Goods',
            'Quality of Environment': 'Governmental Services',
            'Schools': 'Communication Services',
            'Colleges & Universities': 'Communication Services',
            'Work Life Balance': 'Infrastructure & Real Estate',
          };
          return m[cat] || cat;
        }
        function categoryColor(cat){
          const map = {
            'Hospitals & Healthcare': '#FFF7ED',
            'Schools': '#F0F9FF',
            'Colleges & Universities': '#F5F3FF',
            'Industrial & Manufacturing': '#ECFDF5',
            'Offices & Corporate': '#FEF2F2',
            'Public & Community Organizations': '#FFFBEB',
            'Travel & Transportation': '#E0F2FE',
            'Foods & Consumables': '#FDF2F8',
            'Pharmacy & Pharmaceuticals': '#EEF2FF',
          };
          const m = map[String(cat||'').trim()];
          if (m) return m;
          const palette = ['#F0FDF4','#F0F9FF','#FDF2F8','#EEF2FF','#F1F5F9'];
          const s = String(cat || '');
          let h = 0; for (let i=0;i<s.length;i++){ h = (h*31 + s.charCodeAt(i))>>>0; }
          return palette[Math.abs(h)%palette.length];
        }

        const cardsMount = document.getElementById('cardsMount');
        const cardsEmpty = document.getElementById('cardsEmpty');
        const existingMount = document.getElementById('existingLists');

        function isServiceCategory(cat){ const c = deriveCategory(cat) || cat; return c !== 'Foods & Consumables'; }

        function renderCards(){
          const lists = getChecklists().filter(c => c.published !== false && isServiceCategory(c.category));
          cardsMount.innerHTML='';
          const categoriesRaw = Array.from(new Set(lists.map(c => deriveCategory(c.category) || 'Uncategorized'))).sort((a,b)=>a.localeCompare(b));
          let categories = categoriesRaw.length ? categoriesRaw : ['Hospitals & Healthcare','Schools','Colleges & Universities','Industrial & Manufacturing','Offices & Corporate','Public & Community Organizations','Travel & Transportation'];
          categories = ['Hospitals & Healthcare'].concat(categories.filter(c => c !== 'Hospitals & Healthcare'));
          cardsEmpty.hidden = categories.length > 0;
          const byCat = new Map(); categories.forEach(cat => byCat.set(cat, []));
          lists.forEach(c => { const cat = deriveCategory(c.category) || 'Uncategorized'; byCat.get(cat).push(c); });
          categories.forEach(cat => {
            const items = [];
            const card = document.createElement('div'); card.className='card info'; card.style.background=categoryColor(cat); card.style.border='1px solid #e5e7eb';
            const title = document.createElement('div'); title.className='item-title'; title.textContent = displayCategory(cat);
            const sub = document.createElement('div'); sub.className='item-sub'; sub.textContent = 'No checklists yet';
            const actions = document.createElement('div'); actions.className='actions';
            // No checklist actions — customer-centric lists will be added under each category later
            card.append(title, sub, actions);
            cardsMount.appendChild(card);
          });
        }

        function renderExisting(){
          existingMount.innerHTML = '';
          const note = document.createElement('p'); note.className = 'hint';
          note.textContent = 'No customer‑centric checklists have been published yet under service categories. They will appear here once created.';
          existingMount.appendChild(note);
        }

        try { renderCards(); renderExisting(); } catch {}
      })();
    </script>
  </body>
  </html>
