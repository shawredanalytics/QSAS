<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ISO 9001:2015 — QuXAT Self Assessment</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css" />
  </head>
  <body>
    <header class="site-header logo-only">
      <div class="brand-bar container wide">
        <div class="brand-left">
          <img class="brand-logo" alt="QuXAT" src="assets/QuXAT%20Logo%20Facebook.png" />
        </div>
      </div>
    </header>

    <section class="hero">
      <div class="hero-inner">
        <h1 class="hero-title">ISO 9001:2015 — QuXAT Self Assessment</h1>
        <p class="hero-subtitle">Self‑assess your organization’s Quality Management System against ISO 9001:2015. View a QuXAT Self‑Assessment Score and download a score card.</p>
      </div>
    </section>

    <main class="container wide">
      <section class="card">
        <h3>Organization Details</h3>
        <div class="grid" style="display:grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap:8px; margin-bottom:8px;">
          <label class="card"><div class="item-title">Organization Name</div><input type="text" id="orgInput" placeholder="e.g., City Hospital" /></label>
          <label class="card"><div class="item-title">Contact Email</div><input type="email" id="emailInput" placeholder="e.g., user@example.com" /></label>
        </div>

        <div class="card info" id="liveInline" style="margin-top:8px;">
          <div style="display:flex; align-items:center; gap:12px;">
            <strong>Live Score</strong>
            <span id="liveScoreInline">0 / 100</span>
            <span id="liveClassInline" class="badge">—</span>
            <span id="livePercentInline" class="badge">0%</span>
          </div>
        </div>

        <div id="itemsList" class="list checklist"></div>
        <div class="score-row">
          <div class="actions">
            <button id="resetBtn" class="btn btn-warning">Reset Selection</button>
            <button id="downloadScoreBtn" class="btn btn-primary">Download QSAS Score Card</button>
            <button id="whatsappBtn" class="btn btn-success">Contact Advisory Team</button>
          </div>
        </div>

        <div id="sugs" class="card info" hidden>
          <h3>Suggested Improvements</h3>
          <ul id="sugList" class="list"></ul>
        </div>
      </section>
    </main>

    <div id="liveScoreBar" class="score-bar" aria-live="polite">
      <div style="display:flex; align-items:center; justify-content:space-between; gap:12px;">
        <div style="display:flex; align-items:center; gap:10px;">
          <strong>Live Score</strong>
          <span id="liveScoreText">0 / 100</span>
          <span id="liveClass" class="badge">—</span>
        </div>
        <div style="flex:1; max-width:360px;">
          <div style="height:8px; border:1px solid var(--border); border-radius:8px; background:#F1F5F9; overflow:hidden;">
            <div id="liveProgress" style="height:100%; width:0%; background:var(--primary);"></div>
          </div>
        </div>
      </div>
    </div>

    <script src="assets/js/storage.js"></script>
    <script>
      (function(){
        const ISO_ITEMS = [
          'Quality Policy approved, communicated, and reviewed',
          'QMS scope defined; context of the organization documented',
          'Process map with inputs/outputs, owners, and interactions',
          'Documented procedures and records under control',
          'Risk‑based thinking implemented (risk register and actions)',
          'Competence, awareness, and training records maintained',
          'Customer requirements handling and satisfaction measurement',
          'Supplier/outsourced process controls and evaluations',
          'Monitoring and measurement of process performance (KPIs)',
          'Internal audit program executed with findings and CAPA',
          'Management review performed with decisions and actions',
          'Nonconformity and corrective action procedure practiced'
        ];

        const list = document.getElementById('itemsList');
        const liveScoreText = document.getElementById('liveScoreText');
        const liveClass = document.getElementById('liveClass');
        const liveProgress = document.getElementById('liveProgress');
        const liveScoreInline = document.getElementById('liveScoreInline');
        const liveClassInline = document.getElementById('liveClassInline');
        const livePercentInline = document.getElementById('livePercentInline');
        const orgInput = document.getElementById('orgInput');
        const emailInput = document.getElementById('emailInput');
        const sugBox = document.getElementById('sugs');
        const sugList = document.getElementById('sugList');
        const resetBtn = document.getElementById('resetBtn');
        const downloadScoreBtn = document.getElementById('downloadScoreBtn');

        const metrics = ISO_ITEMS.map((t, i) => ({ id: 'm'+i, name: t, points: Math.round(100 / ISO_ITEMS.length) }));
        const selected = new Set();

        function classify(score){
          let label = '—';
          if (score >= 90) label = 'Exemplary';
          else if (score >= 75) label = 'Strong';
          else if (score >= 50) label = 'Developing';
          else if (score >= 25) label = 'Early';
          else label = 'Needs Immediate Improvement';
          return { label, percent: score };
        }

        function render(){
          list.innerHTML = '';
          metrics.forEach((m) => {
            const li = document.createElement('li');
            const title = document.createElement('div'); title.className = 'item-title'; title.textContent = m.name;
            const actions = document.createElement('div'); actions.className = 'item-actions';
            const yes = document.createElement('input'); yes.type = 'checkbox'; yes.checked = selected.has(m.id);
            yes.onchange = () => { if (yes.checked) selected.add(m.id); else selected.delete(m.id); update(); };
            actions.append(yes);
            li.append(title, actions);
            list.appendChild(li);
          });
        }

        function update(){
          const ids = Array.from(selected);
          const score = metrics.length ? Math.round((ids.length / metrics.length) * 100) : 0;
          const cls = classify(score);
          try {
            liveScoreText.textContent = String(score) + ' / 100';
            liveClass.textContent = cls.label; liveClass.className = 'badge';
            liveProgress.style.width = String(Math.max(0, Math.min(100, cls.percent))) + '%';
            liveScoreInline.textContent = String(score) + ' / 100';
            liveClassInline.textContent = cls.label; liveClassInline.className = 'badge';
            livePercentInline.textContent = String(cls.percent) + '%';
          } catch(e) {}
          const missing = metrics.filter(m => !ids.includes(m.id)).map(m => m.name);
          if (missing.length){
            sugBox.hidden = false; sugList.innerHTML = '';
            missing.slice(0, 12).forEach(s => { const li = document.createElement('li'); li.textContent = s; sugList.appendChild(li); });
          } else { sugBox.hidden = true; sugList.innerHTML = ''; }
          try { window.__qsasLatest = { ids, score, cls, selectedItems: metrics.filter(m=>ids.includes(m.id)).map(m=>m.name), org: (orgInput && orgInput.value)||'', email: (emailInput && emailInput.value)||'' }; } catch(e) {}
        }

        try {
          const prevOrg = localStorage.getItem('qsas_iso_org') || '';
          const prevEmail = localStorage.getItem('qsas_iso_email') || '';
          if (orgInput) orgInput.value = prevOrg;
          if (emailInput) emailInput.value = prevEmail;
          orgInput && orgInput.addEventListener('input', () => { try { localStorage.setItem('qsas_iso_org', orgInput.value || ''); } catch(e){} });
          emailInput && emailInput.addEventListener('input', () => { try { localStorage.setItem('qsas_iso_email', emailInput.value || ''); } catch(e){} });
        } catch(e){}

        resetBtn.addEventListener('click', () => { selected.clear(); render(); update(); });

        function openWhatsApp(){
          const phone = '916301237212';
          const latest = window.__qsasLatest || { ids: Array.from(selected) };
          const cnt = Array.isArray(latest.ids) ? latest.ids.length : (selected.size || 0);
          const msg = 'Hello QuXAT Advisory Team, I need assistance for ISO 9001:2015 self assessment. Selected items: ' + cnt + '.';
          alert('We will open WhatsApp to contact +91 6301237212. If WhatsApp is not installed, the web WhatsApp page will open.');
          const protoUrl = 'whatsapp://send?phone=' + phone + '&text=' + encodeURIComponent(msg);
          const webUrl = 'https://wa.me/' + phone + '?text=' + encodeURIComponent(msg);
          try {
            const w = window.open(protoUrl, '_blank');
            setTimeout(() => { try { if (!w || w.closed) window.open(webUrl, '_blank'); } catch(e){ window.open(webUrl, '_blank'); } }, 800);
          } catch(e){ window.open(webUrl, '_blank'); }
        }
        document.getElementById('whatsappBtn').addEventListener('click', openWhatsApp);

        function downloadScore(){
          const d = window.__qsasLatest || { ids: [], score: 0, cls: { label:'', percent:0 }, selectedItems: [], org: (orgInput&&orgInput.value)||'', email: (emailInput&&emailInput.value)||'' };
          const title = 'QuXAT Self Assessment Score Card — ISO 9001:2015';
          try {
            const { jsPDF } = window.jspdf || {};
            if (jsPDF) {
              const doc = new jsPDF({ unit:'pt', format:'a4' });
              const pw = doc.internal.pageSize.getWidth(); const ph = doc.internal.pageSize.getHeight();
              const m = 40; const mw = pw - 2*m; let y = m;
              doc.setDrawColor(51,65,85); doc.setLineWidth(1.2); doc.rect(m-6, m-6, pw - 2*(m-6), ph - 2*(m-6));
              const logo = (window.QSAS_ASSETS && (window.QSAS_ASSETS['assets/QuXAT Logo Facebook.png'] || window.QSAS_ASSETS['assets/QuXAT%20Logo%20Facebook.png'])) || '';
              if (logo) { try { doc.addImage(logo, 'PNG', m, y, 120, 60); } catch(e) {} }
              doc.setFont('helvetica','bold'); doc.setFontSize(26);
              const cx = m + mw/2; doc.text(title, cx, y + 28, { align:'center', maxWidth: mw });
              doc.setFont('helvetica','italic'); doc.setFontSize(13); doc.text('Certificate of Self Assessment', cx, y + 44, { align:'center' });
              doc.setFont('helvetica','normal'); doc.setFontSize(12); y += 86;
              const write = (t, lh=16) => { const lines = doc.splitTextToSize(String(t||''), mw); lines.forEach(line=>{ if (y>ph-m) { doc.addPage(); y=m; } doc.text(line, m, y); y+=lh; }); };
              doc.setFont('helvetica','bold'); doc.setFontSize(14); doc.text('Organization', m, y); y += 18; doc.setFont('helvetica','normal'); doc.setFontSize(12);
              doc.text('Name:', m, y); doc.text(String(d.org||'-'), m+90, y); y += 16;
              doc.text('Email:', m, y); doc.text(String(d.email||'-'), m+90, y); y += 16;
              doc.text('Standard:', m, y); doc.text('ISO 9001:2015', m+90, y); y += 16;
              doc.text('Date:', m, y); doc.text(new Date().toLocaleString(), m+90, y); y += 12;
              doc.setDrawColor(229,231,235); doc.setLineWidth(0.8); doc.line(m, y+6, m+mw, y+6); y += 18;
              const boxY = y; const boxH = 78; doc.setDrawColor(71,116,226); doc.setFillColor(246,249,255); doc.rect(m, boxY, mw, boxH, 'FD');
              doc.setFont('helvetica','bold'); doc.setFontSize(15); doc.text('QuXAT Self Assessment Score', cx, boxY+26, { align:'center' });
              doc.setFont('helvetica','normal'); doc.setFontSize(12);
              doc.text('Score: ' + String(d.score) + ' / 100', m+16, boxY+50);
              doc.text('Classification: ' + String(d.cls.label||'—') + ' (' + String(d.cls.percent||0) + '%)', m+260, boxY+50);
              y = boxY + boxH + 18;
              doc.setFont('helvetica','bold'); doc.setFontSize(14); doc.text('Selected Practices', m, y); y += 14; doc.setDrawColor(229,231,235); doc.line(m, y, m+mw, y); y += 10; doc.setFont('helvetica','normal'); doc.setFontSize(12);
              (Array.isArray(d.selectedItems)?d.selectedItems:[]).slice(0,24).forEach(it=>{ const lines = doc.splitTextToSize('• ' + String(it), mw); lines.forEach(line=>{ if (y>ph-m) { doc.addPage(); y=m; } doc.text(line, m, y); y += 16; }); });
              doc.setFont('helvetica','bold'); doc.setFontSize(14); doc.text('Suggested Improvements', m, y); y += 14; doc.setDrawColor(229,231,235); doc.line(m, y, m+mw, y); y += 10; doc.setFont('helvetica','normal'); doc.setFontSize(12);
              const missing = ISO_ITEMS.filter(t=>!(Array.isArray(d.selectedItems)?d.selectedItems:[]).includes(t));
              missing.slice(0,24).forEach(s=>{ const lines = doc.splitTextToSize('• ' + String(s), mw); lines.forEach(line=>{ if (y>ph-m) { doc.addPage(); y=m; } doc.text(line, m, y); y += 16; }); });
              y += 8;
              let sy = y + 10; doc.setFont('helvetica','bold'); doc.setFontSize(14); doc.text('Prepared By', m, sy); sy += 20; doc.setFont('helvetica','normal'); doc.setFontSize(12);
              doc.text('Name: ______________________________', m, sy); sy += 18; doc.text('Designation: ________________________', m, sy); sy += 18; doc.text('Signature: __________________________', m, sy); sy += 18; doc.text('Date: _______________________________', m, sy);
              sy += 30; doc.setFont('helvetica','bold'); doc.setFontSize(14); doc.text('Approved By', m, sy); sy += 20; doc.setFont('helvetica','normal'); doc.setFontSize(12);
              doc.text('Name: ______________________________', m, sy); sy += 18; doc.text('Designation: ________________________', m, sy); sy += 18; doc.text('Signature: __________________________', m, sy); sy += 18; doc.text('Date: _______________________________', m, sy);
              const seal = (window.QSAS_ASSETS && window.QSAS_ASSETS['assets/QuXAT_Round_Seal.png']) || '';
              if (seal) { try { doc.addImage(seal, 'PNG', m + mw - 120, ph - m - 120, 96, 96); } catch(e) {} }
              doc.save('qsas_iso9001_score_card.pdf'); return;
            }
          } catch(e) {}
          // Fallback to text
          try {
            const lines = [title,'Organization: ' + String(d.org||''),'Email: ' + String(d.email||''),'Date: ' + new Date().toLocaleString(),'Selected Items: ' + String(d.ids.length),'Score: ' + String(d.score),'Classification: ' + String(d.cls.label||'—') + ' (' + String(d.cls.percent||0) + '%)','Selected:'].concat((Array.isArray(d.selectedItems)?d.selectedItems:[]).map(x=>'- '+x)).concat(['Suggested Improvements:']).concat(ISO_ITEMS.filter(t=>!(Array.isArray(d.selectedItems)?d.selectedItems:[]).includes(t)).map(x=>'- '+x));
            const blob = new Blob([lines.join('\n')], { type: 'text/plain' }); const url = URL.createObjectURL(blob); const a = document.createElement('a'); a.href = url; a.download = 'qsas_iso9001_score_card.txt'; a.click(); setTimeout(()=>URL.revokeObjectURL(url), 1500);
          } catch(e) {}
        }
        downloadScoreBtn.addEventListener('click', downloadScore);

        render(); update();
      })();
    </script>
  </body>
  </html>
