<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>QuXAT Healthcare Quality Grid — Approved Certificate</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css" />
    <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
  </head>
  <body>
    <header class="site-header logo-only">
      <div class="brand-bar container wide">
        <div class="brand-left">
          <img class="brand-logo" alt="QuXAT" src="assets/QuXAT%20Logo%20Facebook.png" />
        </div>
      </div>
    </header>
    <main class="container wide">
      <section class="cert-hero">
        <h2>QuXAT Healthcare Quality Grid — Approved Certificate</h2>
      </section>
      <section class="certificate-card">
        <img class="cert-seal" src="assets/QuXAT_Round_Seal.png" alt="QuXAT Seal" />
        <div id="certBlock" class="certificate-body"></div>
        <div class="actions mt">
          <button id="downloadPdfBtn" class="btn btn-primary">Download PDF</button>
          <button id="printBtn" class="btn">Print</button>
        </div>
      </section>
    </main>
    <script>
      (function(){
        const certEl = document.getElementById('certBlock');
        function decodePayload(){
          try {
            const sp = new URLSearchParams(window.location.search);
            const b64 = sp.get('payload') || localStorage.getItem('qsas_cert_payload') || '';
            if (!b64) return null;
            // Decode Base64 UTF-8 safely
            const bytes = Uint8Array.from(atob(b64), c => c.charCodeAt(0));
            const text = new TextDecoder('utf-8').decode(bytes);
            return JSON.parse(text);
          } catch(e){
            try { return JSON.parse(atob(b64)); } catch(_) { return null; }
          }
        }
        function badgeFromAccs(accs){
          const s = (Array.isArray(accs) ? accs.join(' | ') : '').toLowerCase();
          if (s.includes('nabl accreditation')) return 'NABL Accredited';
          if (s.includes('nabl entry')) return 'NABL Entry Level';
          if (s.includes('nabh accreditation')) return 'NABH Accredited';
          if (s.includes('nabh entry')) return 'NABH Entry Level';
          if (s.includes('jci')) return 'JCI Accredited';
          if (s.includes('iso')) return 'ISO Accredited';
          return '';
        }
        const data = decodePayload() || {};
        const lines = [];
        const badge = badgeFromAccs(data.accreditations);
        lines.push({k:'Organization', v: data.orgName || '-' });
        lines.push({k:'Industry', v: data.orgType || '-' });
        lines.push({k:'ID', v: data.regCode || '-' });
        const locs = [data.orgCountry, data.orgState, data.orgDistrict, data.orgCity].filter(Boolean).join(', ');
        lines.push({k:'Location', v: locs || '-' });
        lines.push({k:'Accreditations', v: Array.isArray(data.accreditations) && data.accreditations.length ? data.accreditations.join(', ') : '-' });
        if (badge) lines.push({k:'Quality Badge', v: badge});
        lines.push({k:'Status', v: String(data.status || 'approved').toUpperCase()});
        lines.push({k:'Verified At', v: data.verifiedAt || '-' });
        const wrapRow = (k,v) => `<div class="certificate-row"><span class="label">${k}</span><span>${v}</span></div>`;
        certEl.innerHTML = `<div class="certificate-rows">` + lines.map(x => wrapRow(x.k,x.v)).join('') + `</div>`;

        document.getElementById('printBtn').onclick = () => window.print();
        document.getElementById('downloadPdfBtn').onclick = () => {
          try {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF({ unit:'mm', format:'a4' });
            // Header bar in QuXAT blue
            doc.setFillColor(71,116,226);
            doc.rect(0, 0, 210, 22, 'F');
            // No logo on header per request; use branded bar only
            // Title in white
            doc.setTextColor(255,255,255);
            doc.setFont('helvetica','bold'); doc.setFontSize(16);
            doc.text('QuXAT Healthcare Quality Grid — Approved Certificate', 42, 12);

            // Certificate card border
            doc.setDrawColor(71,116,226);
            doc.roundedRect(10, 26, 190, 260, 3, 3, 'S');

            // Place seal image
            try {
              const seal = window.QSAS_ASSETS && window.QSAS_ASSETS['assets/QuXAT_Round_Seal.png'];
              if (seal) doc.addImage(seal, 'PNG', 178, 28, 18, 18);
            } catch(e) {}

            // Content area
            let y = 40, left = 15;
            doc.setTextColor(0,0,0);
            doc.setFont('helvetica','normal'); doc.setFontSize(12);
            const maxW = 180;
            function writeLine(t){ const split = doc.splitTextToSize(t, maxW); split.forEach(ln => { doc.text(ln, left, y); y += 6; if (y > 275) { doc.addPage(); y = 20; } }); }
            function writeKV(k,v){
              const labelCol = 45; const valMaxW = 190 - (left + labelCol);
              doc.setFont('helvetica','bold'); doc.text(k + ':', left, y);
              doc.setFont('helvetica','normal');
              const value = v || '-';
              const lines = doc.splitTextToSize(value, valMaxW);
              lines.forEach((ln, i) => {
                doc.text(ln, left + labelCol, y);
                y += 6;
                if (y > 275) { doc.addPage(); y = 20; }
              });
              y += 2;
            }

            writeKV('Organization', (data.orgName || '-'));
            writeKV('Industry', (data.orgType || '-'));
            writeKV('ID', (data.regCode || '-'));
            writeKV('Location', (locs || '-'));
            writeKV('Accreditations', (Array.isArray(data.accreditations) && data.accreditations.length ? data.accreditations.join(', ') : '-'));
            if (badge) writeKV('Quality Badge', badge);
            writeKV('Status', String(data.status || 'approved').toUpperCase());
            writeKV('Verified At', (data.verifiedAt || '-'));
            doc.save('QuXAT_Grid_Certificate_' + (data.regCode || 'certificate') + '.pdf');
          } catch(e) { alert('Unable to download PDF'); }
        };
      })();
    </script>
  </body>
</html>
